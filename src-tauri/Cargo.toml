[package]
name = "quickfox"
version = "1.3.0"
description = "Cross-platform quick launcher inspired by Listary"
authors = ["ZhangZZds <zzds1992@gmail.com>"]
edition = "2021"

[lib]
name = "quickfox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
toml = "0.8"
keytap = { version = "0.4.0", default-features = false }
ignore = "0.4.26"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
tantivy = "0.26.1"
nucleo-matcher = "0.3.1"
globset = "0.4.18"
content_inspector = "0.2.4"
tempfile = "3.27.0"
