name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build Release (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Load release notes
        id: release_notes
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NOTES_FILE="releases/v${VERSION}/RELEASE_NOTES.md"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v${VERSION}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package version v${VERSION}."
            exit 1
          fi
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Missing release notes: ${NOTES_FILE}"
            exit 1
          fi
          {
            echo "body<<EOF"
            cat "$NOTES_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload Tauri release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "QuickFox ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build release candidate
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Upload release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: QuickFox-v${{ steps.release_notes.outputs.version }}-${{ runner.os }}-${{ github.sha }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
